# 前端静态托管 + 中台 API 反代。
#
# ## 为什么用同域反代而不是让前端直连 :8080
#
# 1. **免 CORS** —— 前端与 API 同源，浏览器不发预检请求；
# 2. **绕开本机代理坑** —— 项目环境常驻 HTTP 代理，直连 127.0.0.1 会被拦成 502，
#    走同源 `/api` 前缀天然避开；
# 3. **生产形态一致** —— 换正式域名时前端代码一行都不用改。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 关掉版本号暴露（安全基线）
    server_tokens off;

    # gzip：文本类资源压缩后体积能降 60%+，图片本身已压缩无需再压
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- SPA 路由 ----
    # Vue Router 用 history 模式时，直接访问 /article/123 会 404
    # （服务器上不存在该路径），回退到 index.html 交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 带 hash 的构建产物：强缓存 ----
    # Vite 产物文件名含内容 hash，内容变则文件名变 —— 可以放心 immutable。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- 中台 API 反代 ----
    # 注意 proxy_pass **不带尾斜杠**：保留 /api 前缀（中台的路由就是 /api/v1/...）
    location /api/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;      # 中台跑真库聚合时可能慢
    }

    # ---- 配图反代到 RustFS ----
    # 好处：前端只需相对路径 `/images/<object_key>`，
    # 不必知道 RustFS 在内网还是外网、端口是多少。
    location /images/ {
        proxy_pass http://rustfs:9000/powernews-images/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- 健康检查（探活用，与中台 /health 区分开）----
    location = /web-health {
        access_log off;
        return 200 "web ok\n";
        add_header Content-Type text/plain;
    }
}
