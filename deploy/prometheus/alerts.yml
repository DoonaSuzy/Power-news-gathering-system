# 告警规则：电力新闻聚合平台核心异常（对应「实现异常实时告警」交付物）。
# 每条规则带 for 持续时间，避免瞬时抖动误报；最长 5m，满足 ≤5min 告警要求。
groups:
  - name: power-news-alerts
    rules:
      # 采集 / API 目标掉线：up==0 持续 2 分钟。
      - alert: PowerSpiderDown
        expr: up{job="power-fastapi"} == 0
        for: 2m
        labels:
          severity: critical
          team: crawl
        annotations:
          summary: "采集/API 目标不可用 ({{ $labels.instance }})"
          description: "power-fastapi 已掉线超过 2 分钟，请检查容器与依赖（MySQL/Redis）。"

      # 5xx 错误率过高：5 分钟内 5xx 占比 > 5%，持续 5 分钟。
      - alert: HighErrorRate
        expr: |
          sum(rate(power_http_requests_total{status=~"5.."}[5m]))
          / clamp_min(sum(rate(power_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: critical
          team: api
        annotations:
          summary: "API 5xx 错误率过高"
          description: "近 5 分钟 5xx 占比超过 5%，当前值 {{ $value | humanizePercentage }}。"

      # 队列积压：待处理队列深度 > 1000 且持续 5 分钟。
      - alert: QueueBacklog
        expr: power_queue_depth > 1000
        for: 5m
        labels:
          severity: warning
          team: worker
        annotations:
          summary: "采集队列积压"
          description: "待处理队列深度 {{ $value }} 超过 1000，worker 消费能力不足。"

      # 高延迟：p95 请求耗时 > 0.2s（对应 API 平均响应 ≤ 200ms SLO），持续 5 分钟。
      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(power_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          team: api
        annotations:
          summary: "API p95 延迟超过 200ms"
          description: "近 5 分钟 p95 延迟 {{ $value }}s，已超过 0.2s SLO 阈值。"

      # ------------------------------------------------------------------
      # 站点级采集健康度（依赖 newsplatform/services/site_metrics.py）
      #
      # 上面几条看的是「API 活着吗」，这几条看的是「每个站点还在产稿吗」——
      # 之前只有前者，所以 412 反爬把全部站点拦住时，监控一片绿。
      # ------------------------------------------------------------------

      # 站点超过「自身采集间隔 + 30 分钟」没成功采集过（且仍启用、且成功过）。
      #
      # 三个修正，都是生产实测暴露的：
      # 1) 阈值按 crawl_interval_hours 分档——4h 的源在两次正常成功之间天然就会
      #    「2 小时没消息」，固定 7200s 必然误报（实测 1h×32 / 2h×3 / 4h×11）；
      # 2) 加 last_success_ts > 0 的 guard——从没成功过的源会让 time()-0 算出
      #    56 年，抬阈值永远抬不掉；这类源交给 SourceNeverSucceeded 单独负责；
      # 3) 把 (time()-last_success) 放到最左边：`A and B` 取的是 A 的值，
      #    原表达式的 LHS 是 enabled==1，于是注解里的 $value 恒为 1，
      #    生产上一直显示「距今 1s」。
      - alert: SourceStale
        expr: |
          (
            (time() - powernews_source_last_success_ts)
            and on(source, channel, province, category)
            (powernews_source_enabled == 1)
            and on(source, channel, province, category)
            (powernews_source_last_success_ts > 0)
          ) > (powernews_source_interval_hours * 3600 + 1800)
        for: 10m
        labels:
          severity: warning
          team: crawl
        annotations:
          summary: "站点 {{ $labels.source }} 超过采集间隔未成功"
          description: "{{ $labels.channel }}/{{ $labels.source }}（{{ $labels.province }}）最近成功采集距今 {{ $value | humanizeDuration }}，阈值按该源自身采集间隔 + 30 分钟计算。"

      # 从没成功采集过（last_success_ts == 0）。
      #
      # 为什么不并进 SourceStale：这 38 个源的现象是「一次都没跑成」，
      # 处置方式也不同（先查 adapter 与站点可达性，而不是看反爬冷却）。
      # 塞进 SourceStale 会让它们既被算成「56 年未采集」，又被 guard 掉后
      # 永久静默——两种都不对。
      - alert: SourceNeverSucceeded
        expr: |
          (powernews_source_last_success_ts == 0)
          and on(source, channel, province, category)
          (powernews_source_enabled == 1)
        for: 1h
        labels:
          severity: warning
          team: crawl
        annotations:
          summary: "站点 {{ $labels.source }} 从未成功采集"
          description: "{{ $labels.channel }}/{{ $labels.source }} 的 last_success_ts 为 0：该源从未成功跑完一轮，优先查 adapter 配置与站点可达性，而不是反爬。"

      # 启用的站点近 24 小时一条没入库。
      # 加 >0 guard：否则「从未成功」的源会同时命中本规则与 SourceNeverSucceeded，
      # 同一件事报两遍，噪声翻倍。
      - alert: SourceNoArticles
        expr: |
          (powernews_source_articles_24h == 0)
          and on(source, channel, province, category)
          (powernews_source_enabled == 1)
          and on(source, channel, province, category)
          (powernews_source_last_success_ts > 0)
        for: 2h
        labels:
          severity: warning
          team: crawl
        annotations:
          summary: "站点 {{ $labels.source }} 近 24 小时零产出"
          description: "{{ $labels.channel }}/{{ $labels.source }} 连续 24 小时没有新文章入库，检查是否被反爬拦截或栏目改版。"

      # 最近一次任务失败且 24 小时内失败 ≥3 次。
      # 同样把计数放到最左边：否则 $value 取的是 last_job_failed（恒为 1），
      # 注解会写成「失败 1 次」。
      - alert: SourceFailing
        expr: |
          (
            powernews_source_failures_24h
            and on(source, channel, province, category)
            (powernews_source_last_job_failed == 1)
          ) >= 3
        for: 15m
        labels:
          severity: critical
          team: crawl
        annotations:
          summary: "站点 {{ $labels.source }} 连续采集失败"
          description: "近 24 小时失败/待重试任务 {{ $value }} 次，最近一次仍失败。"

      # 全库最新文章超过 3 小时（说明整条采集链路停了）。
      - alert: CollectorLagHigh
        expr: powernews_collector_lag_seconds > 10800
        for: 10m
        labels:
          severity: critical
          team: crawl
        annotations:
          summary: "采集链路停滞"
          description: "全库最新文章距今 {{ $value | humanizeDuration }}，所有站点可能同时被拦或 worker 未消费。"

      # 站点指标本身停止刷新（后台任务挂了/查库失败）。
      - alert: SiteMetricsStale
        expr: (time() - powernews_site_metrics_refresh_ts) > 300
        for: 5m
        labels:
          severity: warning
          team: api
        annotations:
          summary: "站点指标停止刷新"
          description: "site_metrics 后台任务超过 5 分钟未刷新，站点级告警可能已失效。"
