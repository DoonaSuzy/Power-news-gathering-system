# 电力新闻聚合 + 数据中台 —— 全栈编排
#
# 用法：
#   docker compose --env-file .env up -d --build              # 核心栈（mysql/redis/fastapi/scheduler/worker）
#   docker compose --env-file .env --profile ops up -d        # 再加 Prometheus / Grafana
#
# 三个约定
# 1) 采集层读 POWERNEWS_*，中台读 POWERNEWS_PLATFORM_*（见 .env.example）。
#    DSN 在本文件里用「用户/口令/库名」三段拼出来，主机名固定为服务名 mysql——
#    这样 .env 只需维护一份口令，且容器网络与本机开发互不干扰。
# 2) 一个镜像三种角色：fastapi 用 Dockerfile 的 CMD，scheduler / worker
#    各自覆盖 command。三个服务共用同一条 build 与同一个 tag，否则 scrapy +
#    sqlalchemy 会被打成三份 ~700MB 镜像标签（VM 磁盘只有 40G）。
# 3) 宿主机 8000 端口已被同机的 newsagg-fastapi 占用，中台对外走 8080。
name: power-news

x-app-build: &app-build
  context: .
  dockerfile: newsplatform/Dockerfile

x-app-image: &app-image power-news/app:local

x-app-env: &app-env
  POWERNEWS_MYSQL_HOST: mysql
  POWERNEWS_MYSQL_PORT: "3306"
  POWERNEWS_MYSQL_USER: ${POWERNEWS_MYSQL_USER:?POWERNEWS_MYSQL_USER 未设置}
  POWERNEWS_MYSQL_PASSWORD: ${POWERNEWS_MYSQL_PASSWORD:?POWERNEWS_MYSQL_PASSWORD 未设置}
  POWERNEWS_MYSQL_DATABASE: ${POWERNEWS_MYSQL_DATABASE:?POWERNEWS_MYSQL_DATABASE 未设置}
  POWERNEWS_REDIS_URL: redis://redis:6379/0
  POWERNEWS_PLATFORM_DATABASE_URL: >-
    mysql+aiomysql://${POWERNEWS_MYSQL_USER}:${POWERNEWS_MYSQL_PASSWORD}@mysql:3306/${POWERNEWS_PLATFORM_MYSQL_DATABASE:?POWERNEWS_PLATFORM_MYSQL_DATABASE 未设置}?charset=utf8mb4
  POWERNEWS_PLATFORM_COLLECTOR_DATABASE_URL: >-
    mysql+aiomysql://${POWERNEWS_MYSQL_USER}:${POWERNEWS_MYSQL_PASSWORD}@mysql:3306/${POWERNEWS_MYSQL_DATABASE}?charset=utf8mb4
  # 省级数据域。留空则 channel=province 返回 503、all 自动降级为 power（设计内降级）。
  # 默认指向 newsagg 库；要临时关闭就把它设成空字符串。
  POWERNEWS_PLATFORM_PROVINCE_DATABASE_URL: >-
    mysql+aiomysql://${POWERNEWS_MYSQL_USER}:${POWERNEWS_MYSQL_PASSWORD}@mysql:3306/${POWERNEWS_PROVINCE_MYSQL_DATABASE:-newsagg}?charset=utf8mb4
  POWERNEWS_PLATFORM_REDIS_URL: redis://redis:6379/1
  POWERNEWS_PLATFORM_SECRET_KEY: ${POWERNEWS_PLATFORM_SECRET_KEY:?POWERNEWS_PLATFORM_SECRET_KEY 未设置}
  POWERNEWS_PLATFORM_BOOTSTRAP_ADMIN_TOKEN: ${POWERNEWS_PLATFORM_BOOTSTRAP_ADMIN_TOKEN:-}
  POWERNEWS_LOG_LEVEL: ${POWERNEWS_LOG_LEVEL:-INFO}

services:
  mysql:
    image: mysql:8.4
    container_name: power-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${POWERNEWS_MYSQL_ROOT_PASSWORD:-root_dev_pwd}
      # 默认值必须与 .env / 代码里的库名一致（powernews）。
      # 早先写成 power_news（下划线），一旦忘配 POWERNEWS_MYSQL_DATABASE
      # 就会建出一个空壳库，采集却写进 powernews —— 这类「同名不同库」最难排查。
      MYSQL_DATABASE: ${POWERNEWS_MYSQL_DATABASE:-powernews}
      MYSQL_USER: ${POWERNEWS_MYSQL_USER:-newsagg}
      MYSQL_PASSWORD: ${POWERNEWS_MYSQL_PASSWORD:-newsagg_dev_pwd}
      TZ: Asia/Shanghai
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+00:00
    ports:
      # 映射到宿主机，方便本机 Navicat / DBeaver / mysql CLI 直连 127.0.0.1:3306
      - "${POWERNEWS_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 仅**空数据卷**时执行。中台库不在这里建：platform_schema.sql 里没有 USE 语句，
      # 挂进 initdb.d 会把中台表建到采集库里。新库请照 docs/数据中台运行手册.md 跑
      # newsagg init-db + scripts/load_platform_db.py。
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot",
             "-p${POWERNEWS_MYSQL_ROOT_PASSWORD:-root_dev_pwd}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [power-net]

  redis:
    image: redis:7-alpine
    container_name: power-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [power-net]

  fastapi:
    build: *app-build
    image: *app-image
    container_name: power-fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${POWERNEWS_PLATFORM_HOST_PORT:-8080}:8000"
    volumes:
      # 前端构建产物 —— 由中台的 StaticFiles 托管（`newsplatform/main.py` §6）。
      #
      # 为什么由中台托管而不是单独起 Nginx：
      #   ① 同域 → 前端 `/api/v1/...` 直接命中同源路由，天然免 CORS；
      #   ② 不引新镜像 → 84 拉 Docker Hub 极慢（实测 nginx:alpine 三分钟没下来）；
      #   ③ 一个入口 → 用户只记 8080。
      #
      # ⚠️ `web/dist` 是构建产物、**不入版本库**，部署时需单独传输
      #   （`git archive` 打不出来，见 scripts/deploy_84_transfer.py 的说明）。
      - ./web/dist:/app/web/dist:ro
    networks: [power-net]

  scheduler:
    build: *app-build
    image: *app-image
    container_name: power-scheduler
    restart: unless-stopped
    # --loop 才是常驻守护；不带它 schedule 只跑一轮就退出，
    # 配 restart: unless-stopped 会变成无限重启循环。
    command: ["python", "-m", "newsagg", "schedule", "--loop"]
    env_file:
      - .env
    environment:
      <<: *app-env
    # 关掉镜像里的 HEALTHCHECK —— 它是给 fastapi 写的（查 8000 的 /api/v1/health），
    # 而 scheduler 是 CLI 进程、**不监听任何端口**，继承它只会永久 unhealthy。
    # 一个镜像三种角色（fastapi/scheduler/worker）时，健康检查必须按角色覆盖。
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [power-net]

  worker:
    build: *app-build
    image: *app-image
    container_name: power-worker
    restart: unless-stopped
    # supervisor 起 POWERNEWS_WORKER_COUNT 个子进程并负责重启
    command: ["python", "-m", "newsagg", "supervisor"]
    env_file:
      - .env
    environment:
      <<: *app-env
      POWERNEWS_WORKER_COUNT: ${POWERNEWS_WORKER_COUNT:-2}
    # 同 scheduler：CLI 进程不监听端口，关掉镜像里的 HTTP 健康检查
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [power-net]
    # 水平扩展采集能力：docker compose up -d --scale worker=3
    # （scale 时须去掉 container_name，并用 supervisor 而非裸 worker）

  # ---- 气象历史回填：默认不启动，--profile backfill 才拉起 ----
  # 「回填优先」排期：hist_rt 2024 全年（87,129 折算调用）+ hist_fc 2026 至今
  # （67,767）≈ 154,896，按 --per-day 9000 约 17 天跑完。区间与上限都用
  # ``--dry-run`` 在 VM 上实测过，不是估的。
  backfill:
    build: *app-build
    image: *app-image
    container_name: power-backfill
    profiles: ["backfill"]
    restart: unless-stopped
    # 日额度约 08:00（北京时间）重置。打到 --per-day 上限后客户端最多累计等待
    # 10,800s，等不到就 fail fast 退出——所以这里不指望一个进程活满 17 天，
    # 靠 restart 策略 + wx_ingest_progress 续跑（--resume 是默认行为）。
    # 用 && 而不是 ; ：上一个产品没跑完就不进下一个，避免两个进程抢同一份额度。
    command:
      - sh
      - -c
      - >-
        python -m newsagg weather backfill --product hist_rt
        --since 2024-01-01 --until 2024-12-31 --per-day 9000
        &&
        python -m newsagg weather backfill --product hist_fc
        --since 2026-01-01 --per-day 9000
    env_file:
      - .env
    environment:
      <<: *app-env
    # 同上：CLI 进程，关掉镜像里的 HTTP 健康检查
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [power-net]

  # ---- 监控栈：默认不启动，--profile ops 才拉起（内存紧张）----
  prometheus:
    image: prom/prometheus:latest
    container_name: power-prometheus
    restart: unless-stopped
    profiles: ["ops"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - fastapi
    networks: [power-net]

  grafana:
    image: grafana/grafana:latest
    container_name: power-grafana
    restart: unless-stopped
    profiles: ["ops"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # 界面默认语言：中文（Grafana 13.x 内置简体中文翻译）。
      # 用户仍可在个人偏好里覆盖（头像 → Preferences → Language）。
      # 注意：这只翻译 Grafana **自身 UI**（菜单/按钮/提示），
      # 看板面板标题来自 dashboards/power-news.json，本来就是中文。
      GF_DEFAULT_LANGUAGE: zh-Hans
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks: [power-net]

  # ------------------------------------------------------------------
  # RustFS —— S3 兼容对象存储（新闻配图）
  #
  # 为什么是 RustFS 而不是 MinIO：
  #   MinIO 社区版仓库已于 **2026-04-25 永久归档**，官方明确
  #   「THIS REPOSITORY IS NO LONGER MAINTAINED」，且不再提供预编译二进制，
  #   最后一个版本 RELEASE.2025-09-07 已一年未更新 —— CVE 永不开修。
  #   详见 docs/对象存储选型-MinIO与RustFS对比.md
  #
  # 为什么带 profile=storage（默认不起）：
  #   本项目图片总量约 1,000~6,000 张 / 1.5 GB，**并非所有部署都需要对象存储**。
  #   默认不启动，需要时显式开启：
  #     docker compose --env-file .env --profile storage up -d rustfs
  #
  # 端口（**两个都兼听 S3 API**，Console 挂在子路径下）：
  #   9000 = S3 API          http://<host>:9000
  #   9001 = Console UI      http://<host>:9001/rustfs/console/   ← 注意有路径后缀
  #
  # ⚠️ 访问 http://<host>:9000/ 会返回
  #      <Error><Code>AccessDenied</Code><Message>Access Denied</Message></Error>
  #    这是**正确且安全**的行为：根路径是「列出所有桶」，匿名请求必须被拒。
  #    它不是故障，也不代表服务没起来 —— 判断服务是否活着要看 /health。
  #    Console 也不在 9001 的根路径下（那里同样返回 AccessDenied），
  #    而在 **/rustfs/console/** 子路径。
  # ------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: power-rustfs
    restart: unless-stopped
    profiles: ["storage"]
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${POWERNEWS_S3_ACCESS_KEY:?POWERNEWS_S3_ACCESS_KEY 未设置}
      RUSTFS_SECRET_KEY: ${POWERNEWS_S3_SECRET_KEY:?POWERNEWS_S3_SECRET_KEY 未设置}
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # RustFS 提供 /health 端点（MinIO 的 /minio/health/live 在它上面不存在）
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [power-net]

  # ------------------------------------------------------------------
  # 浏览器通道 —— 过瑞数 412 等 JS 挑战（13 个国网站点需要）
  #
  # 为什么用独立 sidecar 而不是装进主镜像：
  #   主镜像被 4 个服务共用（fastapi/scheduler/worker/backfill），
  #   装 Chrome 会让**每个**容器都 +400MB；且浏览器崩溃/内存泄漏
  #   不该影响采集主进程。独立容器可单独重启、单独限资源。
  #
  # 为什么不担心 84 内存只有 3.8G（实测可用 ~1.9G）：
  #   headless Chrome 单实例约 250MB，配合 mem_limit 上限可控；
  #   镜像约 1.5GB，磁盘可用 34G 足够。
  #
  # 为什么不需要 GUI：
  #   headless 模式**不需要 X11** —— 直接渲染到内存。
  #   仅当要「看窗口调试」才需虚拟显示（本项目不需要）。
  #
  # 用法：
  #   docker compose --env-file .env --profile browser up -d browser
  #   CDP 端点：ws://browser:3000（容器内）/ ws://192.168.101.84:3010（宿主）
  # ------------------------------------------------------------------
  browser:
    # jammy 标签对齐目标机 Ubuntu 22.04 —— 用 noble 会因缺 glibc 2.39 报错
    image: mcr.microsoft.com/playwright:v1.49.0-jammy
    container_name: power-browser
    profiles: ["browser"]
    restart: unless-stopped
    # Chromium 必需：默认 /dev/shm 仅 64MB，多标签页必崩
    shm_size: 1gb
    # 资源上限防跑飞（84 可用内存仅 ~1.9G）
    mem_limit: 1g
    cpus: 1.0
    environment:
      TZ: Asia/Shanghai
    # ⚠️ 为什么用 `run-server` 而不是直接 `chromium --remote-debugging-port`：
    #    Chrome 自 v111 起**忽略 `--remote-debugging-address`**（安全修复），
    #    CDP 端口**只监听 127.0.0.1** —— 同 Docker 网络的其他容器也连不上。
    #    镜像里又没有 socat/nginx 可做转发。
    #    `run-server` 自己监听 0.0.0.0:3000 并**内部代理**到浏览器，绕开这个限制。
    #
    # ⚠️ 但 run-server **无法传浏览器启动参数**，因此：
    #    * UA        → 由**客户端** newContext({userAgent}) 设置
    #    * webdriver → 由**客户端** addInitScript 注入规避
    #    两者见 scripts/browser_channel.py 的用法说明。
    # ⚠️ 版本**必须固定**并与镜像标签对齐：不写版本时 npx 拉最新版（1.64），
    #    与镜像自带浏览器（1.49 / chromium-1148）不匹配，连接时报
    #    "Executable doesn't exist at .../chromium_headless_shell-1248/..."。
    #    这个坑很隐蔽：CDP server 能起来（它不需要浏览器），一连就开不了页面。
    command:
      - npx
      - playwright@1.49.0
      - run-server
      - --port=3000
      - --host=0.0.0.0
    ports:
      - "${BROWSER_PORT:-3010}:3000"
    networks: [power-net]
    healthcheck:
      # run-server 无 /health，TCP 探活足够判断进程活着
      test: ["CMD-SHELL", "node -e \"require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  rustfs_data:

networks:
  power-net:
    driver: bridge
